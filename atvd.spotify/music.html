
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Playlist</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #121212;
            color: white;
        }

        .musica {
            background: #222;
            color: white;
            border: 1px solid #444;
            margin-bottom: 10px;
            border-radius: 10px !important;
        }

        .musica img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .btn-tocar {
            background: #f7f9fa;
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h2 class="mb-4">🎵 Minhas músicas</h2>

        <ul id="listaMusicas" class="list-group"></ul>

        <p id="status" class="mt-3 text-secondary"></p>
    </div>

    <script src="music.js"></script>
</body>
</html>
